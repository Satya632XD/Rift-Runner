<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RIFT RUNNER</title>
<style>
  :root{
    --cyan:#39f2e8;
    --magenta:#ff2d8c;
    --amber:#ffb02e;
    --deep:#050208;
    --panel:#0a0714;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden; overscroll-behavior:none;
    font-family:'Orbitron', 'Segoe UI', sans-serif;
  }
  #appRoot{
    position:fixed; inset:0; width:100%; height:100%;
    transform-origin: center center;
  }
  /* Forced-landscape rotation: applied via JS when a touch device is held in
     portrait. This rotates the whole game 90° and remaps it to the physical
     screen's actual pixel dimensions, the same technique landscape-only mobile
     games (Free Fire, etc.) use — no orientation-lock permission required, and
     it works even when the Fullscreen/Orientation APIs are unavailable or denied. */
  body.force-rotate #appRoot{
    width: 100vh;
    height: 100vw;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%) rotate(90deg);
  }
  #canvasWrap, canvas, #touchControls, #boostBtn{
    touch-action:none;
  }
  @font-face{
    font-family:'Orbitron';
    src:local('Orbitron');
  }
  #canvasWrap{position:fixed; inset:0;}
  canvas{display:block; width:100%; height:100%;}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    font-family:'Orbitron', sans-serif; color:#dffcff;
  }
  .hud-topleft{position:absolute; top:14px; left:16px;}
  .hud-topright{position:absolute; top:14px; right:16px; text-align:right;}
  .gate-diamonds{display:flex; gap:6px; margin-bottom:4px;}
  .diamond{
    width:13px; height:13px; transform:rotate(45deg);
    background:rgba(57,242,232,0.15);
    border:1.5px solid rgba(57,242,232,0.5);
    transition:all .15s ease;
  }
  .diamond.lit{
    background:var(--cyan);
    box-shadow:0 0 10px var(--cyan), 0 0 20px var(--cyan);
    border-color:var(--cyan);
  }
  .score-num{font-size:34px; font-weight:900; letter-spacing:1px; text-shadow:0 0 12px rgba(57,242,232,0.7); line-height:1;}
  .mult-row{display:flex; align-items:center; gap:6px; margin-top:4px; font-size:12px; opacity:0.8; letter-spacing:2px;}
  .mult-bar{display:flex; gap:2px;}
  .mult-seg{width:9px; height:5px; background:rgba(255,255,255,0.12); border-radius:1px;}
  .mult-seg.on{background:var(--magenta); box-shadow:0 0 6px var(--magenta);}

  .planet-bar-wrap{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:min(46vw,420px); text-align:center;
  }
  .planet-label{font-size:11px; letter-spacing:3px; color:var(--amber); text-shadow:0 0 8px rgba(255,176,46,0.6); margin-bottom:4px;}
  .planet-track{
    width:100%; height:5px; background:rgba(255,255,255,0.08);
    border-radius:3px; overflow:hidden; border:1px solid rgba(255,255,255,0.15);
  }
  .planet-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--magenta)); box-shadow:0 0 8px var(--cyan);}

  .best-label{font-size:10px; letter-spacing:2px; opacity:0.6;}
  .dist-label{font-size:20px; font-weight:700; text-shadow:0 0 10px rgba(57,242,232,0.6);}

  .warn-flash{
    position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 40%, rgba(255,45,45,0.35) 100%);
    opacity:0; transition:opacity .12s;
  }
  .warn-flash.on{opacity:1;}

  #speedFx{position:fixed; inset:0; pointer-events:none; z-index:40; mix-blend-mode:screen;}

  /* Boost / graze popup text */
  .popup-text{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    font-size:26px; font-weight:900; letter-spacing:4px; opacity:0;
    text-shadow:0 0 16px currentColor;
    pointer-events:none;
  }
  .popup-text.show{animation:popFade .7s ease-out forwards;}
  @keyframes popFade{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0.7);}
    15%{opacity:1; transform:translate(-50%,-50%) scale(1.1);}
    30%{transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-70%) scale(1);}
  }

  /* ---------- Menus ---------- */
  .screen{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #16081f 0%, #030109 70%);
    color:#eafcff;
    opacity:1; transition:opacity .4s ease;
  }
  .screen.hidden{opacity:0; pointer-events:none;}
  .screen-inner{width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; overflow-y:auto;}

  .logo{
    font-size:clamp(38px,7vw,64px); font-weight:900; letter-spacing:10px;
    background:linear-gradient(180deg,#fff 0%, var(--cyan) 55%, var(--magenta) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(57,242,232,0.35);
    margin:0 0 4px 0; text-align:center;
  }
  .logo-sub{font-size:12px; letter-spacing:8px; color:var(--amber); opacity:0.85; margin-bottom:36px;}

  .btn{
    font-family:'Orbitron',sans-serif;
    background:linear-gradient(180deg, rgba(57,242,232,0.16), rgba(57,242,232,0.05));
    border:1px solid rgba(57,242,232,0.55);
    color:#eafcff; padding:14px 40px; font-size:15px; letter-spacing:4px;
    border-radius:2px; cursor:pointer; margin:7px 0;
    box-shadow:0 0 18px rgba(57,242,232,0.15), inset 0 0 12px rgba(57,242,232,0.08);
    transition:all .15s ease; min-width:240px;
    -webkit-appearance:none; appearance:none;
  }
  .btn:active{transform:scale(0.97); background:rgba(57,242,232,0.25);}
  .btn.magenta{border-color:rgba(255,45,140,0.6); box-shadow:0 0 18px rgba(255,45,140,0.18), inset 0 0 12px rgba(255,45,140,0.08);}
  .btn.ghost{background:transparent; border-color:rgba(255,255,255,0.25); box-shadow:none; font-size:12px; padding:10px 26px; opacity:0.75;}

  .menu-col{display:flex; flex-direction:column; align-items:center;}

  /* Level select grid */
  .level-title{font-size:22px; letter-spacing:6px; margin-bottom:22px; text-shadow:0 0 14px var(--cyan);}
  .level-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
    width:min(94vw,920px); margin-bottom:20px;
  }
  @media (max-width:700px){
    .level-grid{grid-template-columns:repeat(2,1fr);}
  }
  .level-card{
    position:relative; border:1px solid var(--accent,rgba(255,255,255,0.2));
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
    border-left:4px solid var(--accent,#666);
    padding:12px 14px; cursor:pointer; text-align:left;
    transition:transform .12s ease, box-shadow .12s ease;
    min-height:88px;
  }
  .level-card:active{transform:scale(0.96);}
  .level-card.locked{opacity:0.4; cursor:default;}
  .level-card .pnum{font-size:9px; letter-spacing:2px; opacity:0.55;}
  .level-card .pname{font-size:16px; font-weight:900; letter-spacing:1px; margin:2px 0;}
  .level-card .pdesc{font-size:9px; letter-spacing:1px; opacity:0.5; text-transform:uppercase;}
  .level-card .pbest{font-size:9px; opacity:0.6; margin-top:6px;}
  .level-card .lock-icon{position:absolute; top:10px; right:10px; font-size:14px; opacity:0.7;}
  .level-card.endless{grid-column:1 / -1; border-left-color:var(--magenta); min-height:60px; display:flex; align-items:center; justify-content:space-between;}

  /* Pause / Game over */
  .stat-row{display:flex; gap:36px; margin:18px 0 28px 0; text-align:center;}
  .stat-row .stat-val{font-size:30px; font-weight:900; text-shadow:0 0 12px var(--cyan);}
  .stat-row .stat-lbl{font-size:10px; letter-spacing:3px; opacity:0.6; margin-top:2px;}
  .newbest{color:var(--amber); font-size:11px; letter-spacing:3px; margin-top:-14px; margin-bottom:20px; text-shadow:0 0 10px var(--amber); animation:pulse 1s infinite alternate;}
  @keyframes pulse{from{opacity:0.5;} to{opacity:1;}}

  /* Touch controls */
  #touchControls{position:fixed; inset:0; z-index:45; pointer-events:none; display:none;}
  #touchControls.active{display:block;}
  .touch-zone{position:absolute; top:0; bottom:0; width:50%; pointer-events:auto;}
  #touchLeft{left:0;}
  #touchRight{right:0;}
  .touch-hint{position:absolute; bottom:18px; font-size:9px; letter-spacing:2px; opacity:0.25; width:100%; text-align:center;}
  #boostBtn{
    position:fixed; right:18px; bottom:18px; z-index:46; pointer-events:auto;
    width:78px; height:78px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,45,140,0.35), rgba(255,45,140,0.05));
    border:2px solid rgba(255,45,140,0.7);
    color:#fff; font-size:10px; letter-spacing:1px; font-weight:900;
    display:flex; align-items:center; justify-content:center; text-align:center;
    box-shadow:0 0 22px rgba(255,45,140,0.3);
  }
  #boostBtn:active{transform:scale(0.92); background:rgba(255,45,140,0.5);}
  #climbHint{position:fixed; left:18px; bottom:18px; z-index:46; font-size:9px; letter-spacing:1px; opacity:0.35; color:#dffcff;}

  .crosshair-note{font-size:10px; opacity:0.4; letter-spacing:2px; margin-top:6px;}

  #loadingScreen{
    position:fixed; inset:0; z-index:200; background:#030109;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    color:var(--cyan); font-family:'Orbitron',sans-serif;
  }
  .loadbar{width:220px; height:3px; background:rgba(57,242,232,0.15); overflow:hidden;}
  .loadbar-fill{height:100%; width:30%; background:var(--cyan); animation:loadsweep 1.1s ease-in-out infinite;}
  @keyframes loadsweep{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(400%);}
  }
</style>
</head>
<body>

<div id="appRoot">

<div id="loadingScreen">
  <div class="logo" style="font-size:32px;">RIFT RUNNER</div>
  <div class="loadbar" id="loadbar"><div class="loadbar-fill"></div></div>
  <div style="font-size:10px; letter-spacing:3px; opacity:0.5;" id="loadingStatus">CALIBRATING HOVERSHIP</div>
  <button class="btn ghost" id="btnLoadRetry" style="display:none; margin-top:18px;">RETRY</button>
</div>

<div id="canvasWrap"><canvas id="c"></canvas></div>
<canvas id="speedFx"></canvas>


<!-- HUD -->
<div id="hud" style="display:none;">
  <div class="hud-topleft">
    <div class="gate-diamonds" id="gateDiamonds"></div>
    <div class="score-num" id="scoreNum">0</div>
    <div class="mult-row">
      <span id="multText">×1.0</span>
      <div class="mult-bar" id="multBar"></div>
    </div>
  </div>
  <div class="planet-bar-wrap">
    <div class="planet-label" id="planetLabel">MERCURY — SOLAR FORGE</div>
    <div class="planet-track"><div class="planet-fill" id="planetFill"></div></div>
  </div>
  <div class="hud-topright">
    <div class="best-label" id="bestLabel">BEST 0%</div>
    <div class="dist-label" id="distLabel">0.00 KM</div>
  </div>
  <div class="warn-flash" id="warnFlash"></div>
  <div class="popup-text" id="popupText"></div>
</div>

<div id="touchControls">
  <div class="touch-zone" id="touchLeft"></div>
  <div class="touch-zone" id="touchRight"></div>
</div>
<div id="boostBtn" style="display:none;">BOOST</div>
<div id="climbHint" style="display:none;">HOLD TO CLIMB · RELEASE TO DIVE</div>

<!-- Main Menu -->
<div class="screen" id="mainMenu">
  <div class="screen-inner">
    <div class="menu-col">
      <div class="logo">RIFT RUNNER</div>
      <div class="logo-sub">SYNTHWAVE CANYON PURSUIT</div>
      <button class="btn" id="btnPlay">SELECT LEVEL</button>
      <button class="btn magenta" id="btnEndless">ENDLESS RIFT</button>
      <button class="btn ghost" id="btnSettings">SETTINGS</button>
      <div class="crosshair-note">TILT / TOUCH / ARROW KEYS TO STEER</div>
    </div>
  </div>
</div>

<!-- Level Select -->
<div class="screen hidden" id="levelSelect">
  <div class="screen-inner">
    <div class="level-title">SELECT LEVEL</div>
    <div class="level-grid" id="levelGrid"></div>
    <button class="btn ghost" id="btnBackFromLevels">← BACK</button>
  </div>
</div>

<!-- Settings -->
<div class="screen hidden" id="settingsScreen">
  <div class="screen-inner">
    <div class="level-title" style="margin-bottom:10px;">SETTINGS</div>
    <div style="width:min(90vw,380px); display:flex; flex-direction:column; gap:16px; margin-bottom:20px;">
      <label style="font-size:11px; letter-spacing:2px; display:flex; justify-content:space-between;">SENSITIVITY <span id="sensVal">100%</span></label>
      <input type="range" id="sensSlider" min="50" max="200" value="100" style="width:100%;">
      <label style="font-size:11px; letter-spacing:2px; display:flex; justify-content:space-between;">SCREEN SHAKE <span id="shakeVal">100%</span></label>
      <input type="range" id="shakeSlider" min="0" max="150" value="100" style="width:100%;">
      <label style="font-size:11px; letter-spacing:2px; display:flex; justify-content:space-between;">INVERT CLIMB <span id="invertVal">OFF</span></label>
      <input type="range" id="invertSlider" min="0" max="1" value="0" style="width:100%;">
    </div>
    <button class="btn" id="btnBackFromSettings">DONE</button>
    <button class="btn ghost" id="btnResetProgress" style="border-color:rgba(255,60,60,0.4); color:#ff8080;">RESET ALL PROGRESS</button>
  </div>
</div>

<!-- Pause -->
<div class="screen hidden" id="pauseScreen">
  <div class="screen-inner">
    <div class="logo" style="font-size:28px;">PAUSED</div>
    <button class="btn" id="btnResume">RESUME</button>
    <button class="btn ghost" id="btnRestartPause">RESTART RUN</button>
    <button class="btn ghost" id="btnQuitPause">QUIT TO MENU</button>
  </div>
</div>

<!-- Game Over -->
<div class="screen hidden" id="gameOverScreen">
  <div class="screen-inner">
    <div class="logo" style="font-size:30px; color:var(--magenta); -webkit-text-fill-color:var(--magenta);">RUN OVER</div>
    <div id="newBestBanner" class="newbest" style="display:none;">◆ NEW BEST ◆</div>
    <div class="stat-row">
      <div><div class="stat-val" id="finalDist">0.00</div><div class="stat-lbl">KM</div></div>
      <div><div class="stat-val" id="finalScore">0</div><div class="stat-lbl">SCORE</div></div>
      <div><div class="stat-val" id="finalMult">×1.0</div><div class="stat-lbl">TOP MULT</div></div>
    </div>
    <button class="btn magenta" id="btnRetry">RETRY</button>
    <button class="btn ghost" id="btnGoMenu">MAIN MENU</button>
  </div>
</div>

<!-- Level Complete -->
<div class="screen hidden" id="levelCompleteScreen">
  <div class="screen-inner">
    <div class="logo" style="font-size:28px;">SECTOR CLEAR</div>
    <div class="stat-row">
      <div><div class="stat-val" id="lcScore">0</div><div class="stat-lbl">SCORE</div></div>
    </div>
    <button class="btn" id="btnNextLevel">NEXT PLANET</button>
    <button class="btn ghost" id="btnLcMenu">MAIN MENU</button>
  </div>
</div>

</div><!-- /#appRoot -->

<script>
/* Boot sequencer: loads Three.js core first and only then starts the game.
   Everything inside RiftRunnerMain() touches THREE.* at the top level (scene,
   renderer, camera, terrain classes are all constructed eagerly), so none of
   it can safely run until the library is confirmed present — a static
   blocking <script src> tag *usually* enforces this via document order, but
   is not a real guarantee (slow/blocked/async-loaded network conditions can
   still race it), so we make the dependency explicit instead. */
(function(){
  const status = document.getElementById('loadingStatus');
  const bar = document.getElementById('loadbar');
  const retryBtn = document.getElementById('btnLoadRetry');

  function showLoadErrorEarly(message){
    if(status) status.textContent = message;
    if(bar) bar.style.display = 'none';
    if(retryBtn){
      retryBtn.style.display = 'inline-block';
      retryBtn.onclick = ()=> location.reload();
    }
  }

  function loadThreeCore(){
    return new Promise((resolve)=>{
      let done = false;
      const finish = (ok)=>{ if(done) return; done = true; resolve(ok); };
      const el = document.createElement('script');
      el.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
      el.onload = ()=> finish(typeof window.THREE !== 'undefined');
      el.onerror = ()=> finish(false);
      document.head.appendChild(el);
      setTimeout(()=> finish(typeof window.THREE !== 'undefined'), 12000);
    });
  }

  loadThreeCore().then(ok=>{
    if(!ok){
      showLoadErrorEarly('CONNECTION TOO SLOW — CHECK NETWORK AND RETRY');
      return;
    }
    try{
      RiftRunnerMain();
    }catch(e){
      console.error('Fatal init error:', e);
      showLoadErrorEarly('SOMETHING WENT WRONG — TAP RETRY');
    }
  });
})();

function RiftRunnerMain(){
"use strict";

/* =========================================================================
   RIFT RUNNER
   Full 3D synthwave endless canyon runner. Single-file build.
========================================================================= */

/* ---------------------------------------------------------------------
   0. PLANET / LEVEL DEFINITIONS
--------------------------------------------------------------------- */
const PLANETS = [
  { id:0, name:"MERCURY", sub:"SOLAR FORGE", accent:0xffb02e, accentCss:"#ffb02e", fog:0x1a0e05, sun:0xffdd88,
    wallLight:0xffb02e, groundTint:0x120a02, lengthKm:3.0, speedMul:1.00, narrowMul:1.00, boltColor:0xff6fd8 },
  { id:1, name:"VENUS", sub:"ACID VEIL", accent:0xff3b3b, accentCss:"#ff3b3b", fog:0x1a0303, sun:0xff8866,
    wallLight:0xff3b3b, groundTint:0x140202, lengthKm:3.6, speedMul:1.06, narrowMul:1.06, boltColor:0xffaa33 },
  { id:2, name:"EARTH", sub:"BLUE CANYON", accent:0x39c8ff, accentCss:"#39c8ff", fog:0x030814, sun:0x88ccff,
    wallLight:0x2288ff, groundTint:0x020610, lengthKm:4.2, speedMul:1.12, narrowMul:1.12, boltColor:0x66ffee },
  { id:3, name:"MARS", sub:"RED WASTES", accent:0xff5533, accentCss:"#ff5533", fog:0x150502, sun:0xff7744,
    wallLight:0xcc3311, groundTint:0x1a0700, lengthKm:4.8, speedMul:1.18, narrowMul:1.18, boltColor:0xffcc44 },
  { id:4, name:"JUPITER", sub:"STORM ALLEY", accent:0xffaa55, accentCss:"#ffaa55", fog:0x140d05, sun:0xffbb77,
    wallLight:0xdd8833, groundTint:0x160e04, lengthKm:5.4, speedMul:1.24, narrowMul:1.26, boltColor:0xff44ee },
  { id:5, name:"SATURN", sub:"RING SHADOW", accent:0xe8d9a8, accentCss:"#e8d9a8", fog:0x0f0d08, sun:0xf0e6c0,
    wallLight:0xbba766, groundTint:0x100d06, lengthKm:6.0, speedMul:1.30, narrowMul:1.32, boltColor:0x99ddff },
  { id:6, name:"URANUS", sub:"ICE BREACH", accent:0x66ffe0, accentCss:"#66ffe0", fog:0x031212, sun:0x88ffe8,
    wallLight:0x33ccbb, groundTint:0x011010, lengthKm:6.6, speedMul:1.36, narrowMul:1.38, boltColor:0xff77cc },
  { id:7, name:"NEPTUNE", sub:"DARK GALE", accent:0x5566ff, accentCss:"#5566ff", fog:0x02021a, sun:0x7788ff,
    wallLight:0x3344cc, groundTint:0x010114, lengthKm:7.2, speedMul:1.42, narrowMul:1.45, boltColor:0x22ffff },
];
const ENDLESS = { id:8, name:"ENDLESS RIFT", sub:"NO LIMIT", accent:0xff2d8c, accentCss:"#ff2d8c", fog:0x0a0210, sun:0xff6fd8,
    wallLight:0xff2d8c, groundTint:0x0a0210, lengthKm:Infinity, speedMul:1.0, narrowMul:1.0, boltColor:0x39f2e8 };

/* ---------------------------------------------------------------------
   1. SAVE DATA
--------------------------------------------------------------------- */
const SAVE_KEY = "riftRunnerSave_v1";
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { unlocked:1, bests:new Array(9).fill(0), bestsKm:new Array(9).fill(0), settings:{sens:100, shake:100, invert:0} };
}
function saveSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){} }
let SAVE = loadSave();
if(!SAVE.bests) SAVE.bests = new Array(9).fill(0);
if(!SAVE.bestsKm) SAVE.bestsKm = new Array(9).fill(0);
if(!SAVE.settings) SAVE.settings = {sens:100, shake:100, invert:0};
if(SAVE.unlocked==null) SAVE.unlocked = 1;

/* ---------------------------------------------------------------------
   2. ORIENTATION HANDLING (auto-rotate to landscape, no prompt)
--------------------------------------------------------------------- */
function isPortrait(){ return window.innerHeight > window.innerWidth; }
function isTouchDevice(){ return ('ontouchstart' in window) || navigator.maxTouchPoints > 0; }

async function tryLockLandscape(){
  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock('landscape');
    }
  }catch(e){ /* not supported / needs fullscreen — fine, CSS auto-rotate covers us regardless */ }
}
// CSS-rotate the whole game 90° when a touch device is held in portrait — the
// same technique landscape-only mobile games use. Requires no permission and
// works even where the Orientation Lock API is unavailable or denied.
function checkOrientation(){
  const shouldRotate = isTouchDevice() && isPortrait();
  document.body.classList.toggle('force-rotate', shouldRotate);
  onResize();
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', ()=> setTimeout(checkOrientation, 150));
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && running) setPaused(true,false); });

/* ---------------------------------------------------------------------
   3. THREE.JS SETUP
--------------------------------------------------------------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:"high-performance" });

/* --- Post-processing: bloom + subtle chromatic aberration, with safe fallback ---
   If the CDN postprocessing scripts fail to load (offline, blocked, mismatched
   version), the game must still run via direct renderer.render() rather than
   crash the whole page. This guard is what keeps mobile playable even when
   optional visual scripts don't come through. */
let composer = null, bloomPass = null, rgbPass = null;

function loadScriptWithTimeout(src, timeoutMs){
  return new Promise((resolve)=>{
    let done = false;
    const finish = (ok)=>{ if(done) return; done = true; resolve(ok); };
    const el = document.createElement('script');
    el.src = src;
    el.onload = ()=> finish(true);
    el.onerror = ()=> finish(false);
    document.head.appendChild(el);
    setTimeout(()=> finish(false), timeoutMs);
  });
}

// Loads bloom/RGB-shift postprocessing in the background. Never blocks boot:
// if any script fails or is slow, the game proceeds with direct rendering.
async function setupPostProcessingAsync(){
  const base = 'https://unpkg.com/three@0.128.0/examples/js/';
  const files = [
    'postprocessing/EffectComposer.js',
    'postprocessing/RenderPass.js',
    'postprocessing/ShaderPass.js',
    'shaders/CopyShader.js',
    'shaders/LuminosityHighPassShader.js',
    'postprocessing/UnrealBloomPass.js',
    'shaders/RGBShiftShader.js',
  ];
  for(const f of files){
    const ok = await loadScriptWithTimeout(base+f, 4000);
    if(!ok) return false; // fail fast; direct rendering already works fine
  }
  try{
    if(typeof THREE.EffectComposer !== 'function') return false;
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      isTouchDevice()?0.85:1.1, 0.55, 0.15
    );
    composer.addPass(bloomPass);
    if(typeof THREE.RGBShiftShader !== 'undefined'){
      rgbPass = new THREE.ShaderPass(THREE.RGBShiftShader);
      rgbPass.uniforms['amount'].value = 0.0006;
      composer.addPass(rgbPass);
    }
    composer.setSize(window.innerWidth, window.innerHeight);
    return true;
  }catch(e){
    console.warn('Postprocessing unavailable, falling back to direct render.', e);
    composer = null;
    return false;
  }
}

function onResize(){
  // Under force-rotate, #appRoot's effective size is 100vh x 100vw (swapped),
  // so the renderer/camera must use those dimensions, not the raw (portrait)
  // window.innerWidth/innerHeight, or the canvas would render at the wrong
  // aspect ratio and get stretched by the CSS rotation.
  const rotated = document.body.classList.contains('force-rotate');
  const w = rotated ? window.innerHeight : window.innerWidth;
  const h = rotated ? window.innerWidth : window.innerHeight;
  renderer.setSize(w,h,true);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  fxCanvas.width = w; fxCanvas.height = h;
  if(composer) composer.setSize(w,h);
  if(bloomPass) bloomPass.resolution.set(w,h);
}

function makeRoadTexture(){
  // Black glass road with a bright dashed white center line, matching reference art.
  const w = 256, h = 1024;
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#020204';
  ctx.fillRect(0,0,w,h);
  // subtle asphalt speckle
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  for(let i=0;i<600;i++){
    ctx.fillRect(Math.random()*w, Math.random()*h, 1, 1);
  }
  // faint side gradient (road catches ambient light near edges)
  const edgeGrd = ctx.createLinearGradient(0,0,w,0);
  edgeGrd.addColorStop(0,'rgba(255,255,255,0.05)');
  edgeGrd.addColorStop(0.5,'rgba(255,255,255,0)');
  edgeGrd.addColorStop(1,'rgba(255,255,255,0.05)');
  ctx.fillStyle = edgeGrd;
  ctx.fillRect(0,0,w,h);
  // dashed center line
  ctx.fillStyle = '#eaf9ff';
  ctx.shadowColor = '#bdeeff';
  ctx.shadowBlur = 14;
  const dashLen = 70, gapLen = 55, lineW = 7;
  for(let y=0; y<h; y+=dashLen+gapLen){
    ctx.fillRect(w/2-lineW/2, y, lineW, dashLen);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 0.25);
  return tex;
}

/* ---------------------------------------------------------------------
   5. PROCEDURAL CANYON TERRAIN
--------------------------------------------------------------------- */
// The canyon is built from sequential "segments" along Z. Each segment has
// a centerline offset (x), a bank angle, a width, and a height profile for
// the two canyon walls. We generate segments ahead of the ship and recycle
// (pool) meshes behind it for endless play.

const SEG_LEN = 8;           // length of one segment along Z
const SEGS_AHEAD = 90;       // how many segments kept alive ahead
const TRACK_HALF_BASE = 9;   // base half-width of drivable track
const WALL_SEG_W = 5;        // width subdivisions across wall face
const WALL_HEIGHT = 46;

// deterministic-ish pseudo random via seeded noise (value noise, cheap)
function hashN(n){
  n = Math.sin(n*127.1)*43758.5453123;
  return n - Math.floor(n);
}
function noise1(x){
  const i = Math.floor(x);
  const f = x - i;
  const a = hashN(i), b = hashN(i+1);
  const u = f*f*(3-2*f);
  return a*(1-u) + b*u;
}
function fbm(x, oct=3){
  let total=0, amp=0.5, freq=1, sum=0;
  for(let i=0;i<oct;i++){
    total += noise1(x*freq)*amp;
    sum += amp;
    amp *= 0.5; freq *= 2.1;
  }
  return total/sum;
}

class Track{
  constructor(planet, seed){
    this.planet = planet;
    this.seed = seed;
    this.segments = []; // {z, cx, bank, halfW, floorY, difficulty}
    this.headIndex = 0; // next segment index to generate
    this.gates = [];    // active gate objects {mesh, z, cx, passed, boost}
    this.gateSpawnCounter = 0;
    this.difficultyRamp = 0;
    this._genUpTo(SEGS_AHEAD);
  }

  centerlineAt(index){
    // smooth wandering centerline using fbm, gets wilder with difficulty
    const diff = Math.min(1, index / 900) ; // 0..1 ramp over ~7km at base seg len
    const amp = 5.5 + diff*7.5;
    const t = index*0.06 + this.seed;
    return (fbm(t,3)-0.5) * 2 * amp;
  }
  bankAt(index){
    const diff = Math.min(1, index/900);
    const t = index*0.045 + this.seed*1.7;
    return (fbm(t,2)-0.5)*2 * (0.35+diff*0.55);
  }
  widthAt(index){
    const diff = Math.min(1, index/900);
    const t = index*0.05 + this.seed*3.1;
    const narrow = (fbm(t,2)); // 0..1
    const base = TRACK_HALF_BASE * (1 - diff*0.28);
    const w = base - narrow*3.2*this.planet.narrowMul*(0.4+diff*0.9);
    return Math.max(3.6, w);
  }
  floorYAt(index){
    const t = index*0.035 + this.seed*5.3;
    const diff = Math.min(1, index/900);
    return Math.sin(t*2.2)*1.6*diff + fbm(t,2)*3*diff;
  }

  _genUpTo(count){
    while(this.segments.length < count){
      const i = this.headIndex;
      const cx = this.centerlineAt(i);
      const bank = this.bankAt(i);
      const halfW = this.widthAt(i);
      const floorY = this.floorYAt(i);
      this.segments.push({ index:i, z: -i*SEG_LEN, cx, bank, halfW, floorY });
      this.headIndex++;
    }
  }
  // remove segments behind a given z (positive direction is -z travel)
  trimBehind(zFront){
    while(this.segments.length && this.segments[0].z > zFront + SEG_LEN*4){
      this.segments.shift();
    }
  }
  sampleAtZ(z){
    // find segment covering world z via interpolation between two nearest
    // segments are ordered decreasing z (0, -8, -16, ...) as index grows
    const idxF = (-z)/SEG_LEN;
    const i0 = Math.floor(idxF);
    const i1 = i0+1;
    // ensure generated
    if(i1+2 >= this.headIndex) this._genUpTo(i1+SEGS_AHEAD);
    const s0 = this.segments.find(s=>s.index===i0) || this._segByIndex(i0);
    const s1 = this.segments.find(s=>s.index===i1) || this._segByIndex(i1);
    if(!s0 || !s1) return { cx:0, bank:0, halfW:TRACK_HALF_BASE, floorY:0 };
    const t = idxF - i0;
    return {
      cx: s0.cx + (s1.cx-s0.cx)*t,
      bank: s0.bank + (s1.bank-s0.bank)*t,
      halfW: s0.halfW + (s1.halfW-s0.halfW)*t,
      floorY: s0.floorY + (s1.floorY-s0.floorY)*t,
    };
  }
  _segByIndex(i){
    if(i<0) i=0;
    const cx = this.centerlineAt(i), bank=this.bankAt(i), halfW=this.widthAt(i), floorY=this.floorYAt(i);
    return { index:i, z:-i*SEG_LEN, cx, bank, halfW, floorY };
  }
}

/* --- Terrain mesh renderer: builds a ribbon of floor + two walls, updated by rebuilding a rolling buffer geometry each frame region --- */
class TerrainMesh{
  constructor(track){
    this.track = track;
    const rows = SEGS_AHEAD+2;
    this.rows = rows;

    // Floor
    this.floorGeo = new THREE.PlaneGeometry(1,1, 24, rows-1);
    this.floorGeo.rotateX(-Math.PI/2);
    this.floorMat = new THREE.MeshStandardMaterial({
      color:0xffffff, roughness:0.45, metalness:0.55,
      emissive:0x000000, map: roadTex,
    });
    this.floorMesh = new THREE.Mesh(this.floorGeo, this.floorMat);
    this.floorMesh.receiveShadow = false;
    scene.add(this.floorMesh);

    // Wireframe fault-line overlay on floor (glowing grid look)
    this.gridGeo = new THREE.PlaneGeometry(1,1, 24, rows-1);
    this.gridGeo.rotateX(-Math.PI/2);
    this.gridMat = new THREE.MeshBasicMaterial({ color:0xffaa33, wireframe:true, transparent:true, opacity:0.16, fog:true });
    this.gridMesh = new THREE.Mesh(this.gridGeo, this.gridMat);
    scene.add(this.gridMesh);

    // Walls (left/right) — cliff faces with wireframe glow like reference art
    this.wallGeoL = new THREE.PlaneGeometry(1,1, 10, rows-1);
    this.wallGeoR = new THREE.PlaneGeometry(1,1, 10, rows-1);
    this.wallMatSolid = new THREE.MeshStandardMaterial({ color:0x050203, roughness:0.9, metalness:0.1, side:THREE.DoubleSide });
    this.wallMeshL = new THREE.Mesh(this.wallGeoL, this.wallMatSolid);
    this.wallMeshR = new THREE.Mesh(this.wallGeoR, this.wallMatSolid.clone());
    scene.add(this.wallMeshL, this.wallMeshR);

    this.wallGlowMatL = new THREE.MeshBasicMaterial({ color:0xffaa33, wireframe:true, transparent:true, opacity:0.55, fog:true });
    this.wallGlowMatR = this.wallGlowMatL.clone();
    this.wallGlowGeoL = new THREE.PlaneGeometry(1,1, 10, rows-1);
    this.wallGlowGeoR = new THREE.PlaneGeometry(1,1, 10, rows-1);
    this.wallGlowMeshL = new THREE.Mesh(this.wallGlowGeoL, this.wallGlowMatL);
    this.wallGlowMeshR = new THREE.Mesh(this.wallGlowGeoR, this.wallGlowMatR);
    scene.add(this.wallGlowMeshL, this.wallGlowMeshR);
  }

  setPalette(planet){
    this.wallMatSolid.color.setHex(planet.groundTint);
    this.wallMeshR.material.color.setHex(planet.groundTint);
    this.wallGlowMatL.color.setHex(planet.wallLight);
    this.wallGlowMatR.color.setHex(planet.wallLight);
    this.gridMat.color.setHex(planet.wallLight);
    // road is a textured asphalt surface now; tint it lightly toward the planet's
    // accent so each world still reads as distinct without hiding the center line
    const c = new THREE.Color(planet.wallLight);
    c.lerp(new THREE.Color(0xffffff), 0.72);
    this.floorMat.color.copy(c);
  }

  update(shipZ){
    const track = this.track;
    const startIndex = Math.max(0, Math.floor(-shipZ/SEG_LEN) - 2);
    track._genUpTo(startIndex + this.rows);

    const floorPos = this.floorGeo.attributes.position;
    const floorUv = this.floorGeo.attributes.uv;
    const gridPos = this.gridGeo.attributes.position;
    const wlPos = this.wallGeoL.attributes.position;
    const wrPos = this.wallGeoR.attributes.position;
    const wglPos = this.wallGlowGeoL.attributes.position;
    const wgrPos = this.wallGlowGeoR.attributes.position;

    const colsFloor = 25; // 24 segments +1
    const colsWall = 11;

    for(let r=0;r<this.rows;r++){
      const idx = startIndex + r;
      const s = track._segByIndex(idx);
      const z = s.z;
      const cx = s.cx;
      const bank = s.bank;
      const halfW = s.halfW;
      const floorY = s.floorY;

      // Floor row: across track width, apply bank as a slight y tilt
      for(let c=0;c<colsFloor;c++){
        const t = c/(colsFloor-1); // 0..1
        const localX = (t-0.5)*2*halfW;
        const x = cx + localX;
        const y = floorY + Math.sin(bank)*localX*0.25;
        const vi = r*colsFloor + c;
        floorPos.setXYZ(vi, x, y, z);
        gridPos.setXYZ(vi, x, y+0.02, z);
        floorUv.setXY(vi, t, idx*(SEG_LEN/24));
      }

      // Wall rows: from track edge outward/upward
      for(let c=0;c<colsWall;c++){
        const t = c/(colsWall-1); // 0 at track edge -> 1 top of cliff
        const outward = t*22 + t*t*10;
        const height = floorY + t*WALL_HEIGHT + Math.sin(idx*0.13+c)*1.5*t;
        // Left wall
        const lx = cx - halfW - outward;
        const vil = r*colsWall + c;
        wlPos.setXYZ(vil, lx, height, z);
        wglPos.setXYZ(vil, lx, height+0.03, z);
        // Right wall
        const rx = cx + halfW + outward;
        wrPos.setXYZ(vil, rx, height, z);
        wgrPos.setXYZ(vil, rx, height+0.03, z);
      }
    }
    floorPos.needsUpdate = true;
    floorUv.needsUpdate = true;
    gridPos.needsUpdate = true;
    wlPos.needsUpdate = true;
    wrPos.needsUpdate = true;
    wglPos.needsUpdate = true;
    wgrPos.needsUpdate = true;
    this.floorGeo.computeVertexNormals();
    this.wallGeoL.computeVertexNormals();
    this.wallGeoR.computeVertexNormals();

    track.trimBehind(shipZ);
  }
}

   6. GATES (boost rings) + SPEED-LINE PARTICLES + COLLAPSING RIFT
--------------------------------------------------------------------- */
function makeGateMesh(color){
  const group = new THREE.Group();
  const ringGeo = new THREE.TorusGeometry(3.1, 0.16, 8, 24);
  const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.95, fog:true });
  const ring = new THREE.Mesh(ringGeo, mat);
  group.add(ring);
  const pillarGeo = new THREE.BoxGeometry(0.12,0.12,0.12);
  return { group, ring, mat };
}

class GateManager{
  constructor(track, planet){
    this.track = track;
    this.planet = planet;
    this.pool = [];
    this.active = [];
    this.nextSpawnIndex = 12;
    this.spawnEvery = 9; // in segment-index units
  }
  setPlanet(planet){ this.planet = planet; }
  _getMesh(){
    if(this.pool.length) return this.pool.pop();
    return makeGateMesh(this.planet.boltColor);
  }
  update(shipIndexF){
    const track = this.track;
    // spawn ahead
    while(this.nextSpawnIndex < shipIndexF + SEGS_AHEAD - 5){
      const idx = Math.round(this.nextSpawnIndex);
      const s = track._segByIndex(idx);
      const g = this._getMesh();
      g.mat.color.setHex(this.planet.boltColor);
      const lateral = (Math.random()-0.5) * Math.max(0, s.halfW-3.4)*1.6;
      g.group.position.set(s.cx+lateral, s.floorY+3.3, s.z);
      g.group.rotation.z = s.bank;
      scene.add(g.group);
      this.active.push({ mesh:g, z:s.z, x:s.cx+lateral, y:s.floorY+3.3, passed:false, spin:0 });
      this.nextSpawnIndex += this.spawnEvery + Math.random()*4;
    }
    // animate + recycle behind ship
    for(let i=this.active.length-1;i>=0;i--){
      const a = this.active[i];
      a.spin += 0.02;
      a.mesh.group.rotation.y = a.spin;
      const bob = Math.sin(performance.now()*0.002 + a.z)*0.15;
      a.mesh.group.position.y = a.y + bob;
      if(a.z > shipZWorld() + 12){
        scene.remove(a.mesh.group);
        this.pool.push(a.mesh);
        this.active.splice(i,1);
      }
    }
  }
  reset(){
    for(const a of this.active){ scene.remove(a.mesh.group); this.pool.push(a.mesh); }
    this.active = [];
    this.nextSpawnIndex = 12;
  }
}
function shipZWorld(){ return ship.pos.z; }

function makeObstacleMesh(color){
  const group = new THREE.Group();
  const bodyGeo = new THREE.BoxGeometry(2.0, 3.2, 1.7);
  const bodyMat = new THREE.MeshStandardMaterial({ color:0x0e0810, roughness:0.6, metalness:0.35, emissive:color, emissiveIntensity:0.65 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  group.add(body);
  const edgeGeo = new THREE.BoxGeometry(2.08,3.28,1.78);
  const edgeMat = new THREE.MeshBasicMaterial({ color, wireframe:true, transparent:true, opacity:0.7, fog:true });
  const edge = new THREE.Mesh(edgeGeo, edgeMat);
  group.add(edge);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color, transparent:true, opacity:0.65, depthWrite:false, fog:false }));
  glow.scale.set(6,6,1);
  group.add(glow);
  return { group, mat:bodyMat, edgeMat, glow };
}

/* Obstacle boxes — ground-level hazards to dodge laterally or climb over.
   Mirrors GateManager's spawn/pool/recycle pattern for consistency. */
class ObstacleManager{
  constructor(track, planet){
    this.track = track;
    this.planet = planet;
    this.pool = [];
    this.active = [];
    this.nextSpawnIndex = 26; // start after the first stretch so players get a clean runway
    this.spawnEvery = 14;
  }
  setPlanet(planet){ this.planet = planet; }
  _getMesh(){
    if(this.pool.length) return this.pool.pop();
    return makeObstacleMesh(0xff3344);
  }
  update(shipIndexF, distProgress){
    const track = this.track;
    // difficulty ramps obstacle frequency; none for the first stretch of any run
    const density = THREE.MathUtils.clamp(0.15 + distProgress*0.35, 0.15, 0.62);
    while(this.nextSpawnIndex < shipIndexF + SEGS_AHEAD - 5){
      const idx = Math.round(this.nextSpawnIndex);
      if(Math.random() < density){
        const s = track._segByIndex(idx);
        const o = this._getMesh();
        const maxLateral = Math.max(0, s.halfW - 1.6);
        const lateral = (Math.random()-0.5) * maxLateral * 1.7;
        const y = s.floorY + 1.7;
        o.group.position.set(s.cx+lateral, y, s.z);
        o.group.rotation.z = s.bank;
        scene.add(o.group);
        this.active.push({ mesh:o, z:s.z, x:s.cx+lateral, y, hit:false });
      }
      this.nextSpawnIndex += this.spawnEvery + Math.random()*6;
    }
    for(let i=this.active.length-1;i>=0;i--){
      const a = this.active[i];
      const pulse = 0.5+Math.sin(performance.now()*0.004+a.z)*0.5;
      a.mesh.edgeMat.opacity = 0.5+pulse*0.35;
      if(a.z > shipZWorld() + 12){
        scene.remove(a.mesh.group);
        this.pool.push(a.mesh);
        this.active.splice(i,1);
      }
    }
  }
  reset(){
    for(const a of this.active){ scene.remove(a.mesh.group); this.pool.push(a.mesh); }
    this.active = [];
    this.nextSpawnIndex = 26;
  }
}

/* Speed-line particles */
class SpeedLines{
  constructor(){
    this.count = 180;
    const geo = new THREE.BufferGeometry();
    this.positions = new Float32Array(this.count*6); // line = 2 pts
    this.speeds = new Float32Array(this.count);
    for(let i=0;i<this.count;i++) this._respawn(i, true);
    geo.setAttribute('position', new THREE.BufferAttribute(this.positions,3));
    const mat = new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.0, fog:false });
    this.mat = mat;
    this.lines = new THREE.LineSegments(geo, mat);
    this.lines.frustumCulled = false;
    scene.add(this.lines);
  }
  _respawn(i, init){
    const r = 3 + Math.random()*13;
    const ang = Math.random()*Math.PI*2;
    const x = Math.cos(ang)*r;
    const y = 1.5 + Math.sin(ang)*r*0.6;
    const z = ship ? ship.pos.z - (init? Math.random()*140 : 140) : -Math.random()*140;
    const idx = i*6;
    this.positions[idx] = x; this.positions[idx+1]=y; this.positions[idx+2]=z;
    this.positions[idx+3] = x; this.positions[idx+4]=y; this.positions[idx+5]=z-2.2;
    this.speeds[i] = 0;
  }
  update(dt, speedFactor){
    this.mat.opacity = THREE.MathUtils.clamp((speedFactor-0.35)*1.4, 0, 0.8);
    const baseX = ship.pos.x, baseZ = ship.pos.z;
    for(let i=0;i<this.count;i++){
      const idx=i*6;
      this.positions[idx+2] += speedFactor* dt * 260;
      this.positions[idx+5] += speedFactor* dt * 260;
      if(this.positions[idx+2] > baseZ + 8){
        const r = 3 + Math.random()*13;
        const ang = Math.random()*Math.PI*2;
        const x = baseX + Math.cos(ang)*r;
        const y = 1.5 + Math.sin(ang)*r*0.6;
        const z = baseZ - 130 - Math.random()*20;
        this.positions[idx]=x; this.positions[idx+1]=y; this.positions[idx+2]=z;
        this.positions[idx+3]=x; this.positions[idx+4]=y; this.positions[idx+5]=z-2.5;
      }
    }
    this.lines.geometry.attributes.position.needsUpdate = true;
  }
}

/* Collapsing rift chasing behind the ship */
class Rift{
  constructor(){
    const geo = new THREE.PlaneGeometry(60,140,1,1);
    this.mat = new THREE.MeshBasicMaterial({ color:0xff2d8c, transparent:true, opacity:0.85, side:THREE.DoubleSide, fog:false });
    this.mesh = new THREE.Mesh(geo, this.mat);
    this.mesh.rotation.x = -Math.PI/2;
    scene.add(this.mesh);
    // glow sprite wall
    this.wall = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:0xff2d8c, transparent:true, opacity:0.9, depthWrite:false, fog:false }));
    this.wall.scale.set(90,90,1);
    scene.add(this.wall);
    this.distanceBehind = 34; // how far behind ship the rift edge sits
  }
  update(dt, catchUpSpeed){
    this.distanceBehind -= catchUpSpeed*dt;
    if(this.distanceBehind < 5) this.distanceBehind = 5; // gameplay clamp, danger flagged elsewhere
    const z = ship.pos.z + this.distanceBehind;
    this.mesh.position.set(ship.pos.x, -6, z+70);
    this.wall.position.set(ship.pos.x, 6, z);
  }
}

function buildShipMesh(){
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color:0x2a1a55, metalness:0.75, roughness:0.25, emissive:0x160a33, emissiveIntensity:0.4 });
  const accentMat = new THREE.MeshStandardMaterial({ color:0xff2d8c, metalness:0.3, roughness:0.4, emissive:0xff2d8c, emissiveIntensity:0.55 });
  const glowMat = new THREE.MeshBasicMaterial({ color:0x39f2e8, fog:false });

  // hull
  const hullGeo = new THREE.ConeGeometry(0.85, 2.6, 6);
  hullGeo.rotateX(Math.PI/2);
  const hull = new THREE.Mesh(hullGeo, bodyMat);
  hull.position.z = -0.2;
  group.add(hull);

  // canopy
  const canGeo = new THREE.SphereGeometry(0.35,10,8,0,Math.PI*2,0,Math.PI*0.55);
  const canMat = new THREE.MeshStandardMaterial({ color:0x111133, metalness:0.9, roughness:0.05, emissive:0x2255ff, emissiveIntensity:0.3});
  const canopy = new THREE.Mesh(canGeo, canMat);
  canopy.rotation.x = Math.PI;
  canopy.position.set(0,0.28,0.35);
  group.add(canopy);

  // wings
  const wingGeo = new THREE.BoxGeometry(1.7,0.08,0.7);
  const wingL = new THREE.Mesh(wingGeo, accentMat);
  wingL.position.set(-1.15,0.0,0.15);
  wingL.rotation.z = 0.12;
  const wingR = wingL.clone();
  wingR.position.x = 1.15;
  wingR.rotation.z = -0.12;
  group.add(wingL, wingR);

  // wingtip fins
  const finGeo = new THREE.BoxGeometry(0.1,0.4,0.5);
  const finL = new THREE.Mesh(finGeo, bodyMat);
  finL.position.set(-1.85,0.2,0.15);
  const finR = finL.clone(); finR.position.x = 1.85;
  group.add(finL, finR);

  // thruster rings (glow)
  const ringGeo = new THREE.TorusGeometry(0.34,0.09,8,16);
  const ringL = new THREE.Mesh(ringGeo, glowMat);
  ringL.position.set(-0.62,-0.15,1.15);
  const ringR = ringL.clone(); ringR.position.x = 0.62;
  group.add(ringL, ringR);
  const ringLight1 = new THREE.PointLight(0x39f2e8, 1.2, 6);
  ringLight1.position.copy(ringL.position);
  const ringLight2 = ringLight1.clone(); ringLight2.position.copy(ringR.position);
  group.add(ringLight1, ringLight2);

  // fin (top)
  const finTopGeo = new THREE.BoxGeometry(0.08,0.5,0.9);
  const finTop = new THREE.Mesh(finTopGeo, accentMat);
  finTop.position.set(0,0.35,-0.5);
  group.add(finTop);

  group.scale.set(1.15,1.15,1.15);
  return { group, ringL, ringR, canopy };
}

class Ship{
  constructor(){
    const built = buildShipMesh();
    this.mesh = built.group;
    this.parts = built;
    scene.add(this.mesh);

    this.pos = new THREE.Vector3(0, 4, 0);
    this.velX = 0;      // lateral velocity

    this.height = 3.4;  // height above floor
    this.vertVel = 0;

}

   8. FX CANVAS (chromatic aberration overlay + camera shake feel + vignette)
--------------------------------------------------------------------- */
const fxCanvas = document.getElementById('speedFx');
const fxCtx = fxCanvas.getContext('2d');

function drawSpeedFx(speedFactor){
  const w = fxCanvas.width, h = fxCanvas.height;
  fxCtx.clearRect(0,0,w,h);
  const intensity = THREE.MathUtils.clamp((speedFactor-0.55)*1.1, 0, 1);
  if(rgbPass) rgbPass.uniforms['amount'].value = 0.0003 + intensity*0.0022 + (boostFx>0?0.0012:0);
  if(intensity <= 0.01) return;
  // Vignette that pulses redshift at extreme speed
  const grd = fxCtx.createRadialGradient(w/2,h/2, h*0.28, w/2,h/2, h*0.72);
  grd.addColorStop(0, 'rgba(0,0,0,0)');
  grd.addColorStop(1, `rgba(${20+intensity*40},0,${30+intensity*20},${0.28*intensity})`);
  fxCtx.fillStyle = grd;
  fxCtx.fillRect(0,0,w,h);
  // radial streak lines near edges
  fxCtx.save();
  fxCtx.globalCompositeOperation = 'screen';
  fxCtx.strokeStyle = `rgba(120,220,255,${0.10*intensity})`;
  fxCtx.lineWidth = 1;
  const cx=w/2, cy=h/2;
  for(let i=0;i<26;i++){
    const ang = (i/26)*Math.PI*2;
    const r0 = Math.max(w,h)*0.42;
    const r1 = r0 + intensity*70 + Math.random()*40*intensity;
    fxCtx.beginPath();
    fxCtx.moveTo(cx+Math.cos(ang)*r0, cy+Math.sin(ang)*r0*0.72);
    fxCtx.lineTo(cx+Math.cos(ang)*r1, cy+Math.sin(ang)*r1*0.72);
    fxCtx.stroke();
  }
  fxCtx.restore();
}

--------------------------------------------------------------------- */
const input = { steer:0, climb:0, boostHeld:false, keys:{} };
let usingTilt = false;
let tiltBaseline = 0;

window.addEventListener('keydown', e=>{
  input.keys[e.code]=true;
  if(e.code==='Escape' && running) togglePause();
});
window.addEventListener('keyup', e=>{ input.keys[e.code]=false; });

function pollKeyboard(){
  let steer=0, climb=0;
  if(input.keys['ArrowLeft']||input.keys['KeyA']) steer -= 1;
  if(input.keys['ArrowRight']||input.keys['KeyD']) steer += 1;
  if(input.keys['ArrowUp']||input.keys['KeyW']) climb += 1;
  if(input.keys['ArrowDown']||input.keys['KeyS']) climb -= 1;
  input.boostHeld = !!(input.keys['Space']||input.keys['ShiftLeft']||input.keys['ShiftRight']);
  return { steer, climb };
}

// Touch controls
const touchLeft = document.getElementById('touchLeft');
const touchRight = document.getElementById('touchRight');
const boostBtn = document.getElementById('boostBtn');
let touchSteerActive = false, touchSteerX = 0, touchStartX = 0, touchStartY = 0;
let touchClimbActive = false;

// When #appRoot is CSS-rotated 90deg for forced landscape, touch events still
// report physical (un-rotated) viewport coordinates. A visual left/right drag
// then shows up as a physical up/down movement, so the delta axis must swap.
function steerDelta(e){
  const t = e.touches[0];
  if(document.body.classList.contains('force-rotate')){
    return t.clientY - touchStartY; // rotate(90deg): visual +X === physical +Y
  }
  return t.clientX - touchStartX;
}

function setupTouch(){
  touchLeft.addEventListener('touchstart', e=>{
    touchSteerActive = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  touchLeft.addEventListener('touchmove', e=>{
    if(!touchSteerActive) return;
    const dx = steerDelta(e);
    touchSteerX = THREE.MathUtils.clamp(dx/90, -1, 1);
  }, {passive:true});
  touchLeft.addEventListener('touchend', ()=>{ touchSteerActive=false; touchSteerX=0; }, {passive:true});

  touchRight.addEventListener('touchstart', ()=>{ touchClimbActive = true; }, {passive:true});
  touchRight.addEventListener('touchend', ()=>{ touchClimbActive = false; }, {passive:true});

  boostBtn.addEventListener('touchstart', e=>{ e.stopPropagation(); input.boostHeld = true; }, {passive:true});
  boostBtn.addEventListener('touchend', e=>{ e.stopPropagation(); input.boostHeld = false; }, {passive:true});

  // Device tilt as alternative steer
  window.addEventListener('deviceorientation', e=>{
    if(e.gamma==null) return;
    usingTilt = true;
    let g = e.gamma; // left-right tilt
    if(window.orientation === 90) g = -e.beta;
    else if(window.orientation === -90) g = e.beta;
    input.tiltRaw = g;
  });
}
setupTouch();

function pollTouch(){
  let steer = touchSteerX;
  if(usingTilt && input.tiltRaw!=null){
    const t = THREE.MathUtils.clamp((input.tiltRaw)/22, -1, 1);
    if(Math.abs(t) > Math.abs(steer)) steer = t;
  }
  const climb = touchClimbActive ? 1 : 0;
  return { steer, climb };
}

/* ---------------------------------------------------------------------
   12. MAIN UPDATE LOOP
--------------------------------------------------------------------- */
let lastGrazeFlash = 0;

function update(dt){
  if(!running || paused) return;
  dt = Math.min(dt, 0.05);

  // --- input
  const kb = pollKeyboard();
  const tc = pollTouch();
  const sens = (SAVE.settings.sens||100)/100;
  let steer = THREE.MathUtils.clamp((kb.steer + tc.steer), -1, 1) * sens;
  let climbInput = (kb.climb!==0? kb.climb : tc.climb);
  if(SAVE.settings.invert) climbInput = -climbInput;

  // --- speed / boost
  const boosting = input.boostHeld && ship.boostTimer<=0 && boostFx<=0;
  if(boosting){
    boostFx = 0.55;
    showPopup('BOOST', currentPlanet.accentCss);
    camShakeT = Math.max(camShakeT, 0.25);
  }
  if(boostFx>0) boostFx -= dt;

  const distProgress = distanceM/1000;
  const rampSpeed = ship.baseSpeed + Math.min(46, distProgress*3.4);
  let targetSpeed = rampSpeed * currentPlanet.speedMul;
  if(boostFx>0) targetSpeed *= 1.85;
  if(multiplier>1) targetSpeed *= 1 + (multiplier-1)*0.05;
  ship.forwardSpeed += (targetSpeed - ship.forwardSpeed) * Math.min(1, dt*1.8);
  ship.forwardSpeed = Math.min(ship.forwardSpeed, ship.maxSpeed*currentPlanet.speedMul*1.9);

  // --- lateral movement
  const steerForce = steer * 34;
  ship.velX += (steerForce - ship.velX) * Math.min(1, dt*6);
  ship.lateralOffset += ship.velX * dt;

  // roll visual
  ship.roll += (steer*0.5 - ship.roll) * Math.min(1, dt*6);

  // --- vertical (climb/dive over terrain undulation)
  const climbForce = climbInput * 10;
  ship.vertVel += (climbForce - ship.vertVel*0.6) * dt*4;
  ship.height += ship.vertVel*dt;
  ship.height = THREE.MathUtils.clamp(ship.height, 1.6, 12);

  // --- advance
  ship.pos.z -= ship.forwardSpeed * dt;
  distanceM += ship.forwardSpeed*dt;

  // sample track under ship
  const sample = track.sampleAtZ(ship.pos.z);
  const trackLocal = ship.lateralOffset;
  ship.pos.x = sample.cx + trackLocal;
  const floorY = sample.floorY;
  ship.pos.y = floorY + ship.height;

  // clamp within canyon; collide with walls
  const edge = sample.halfW - 0.9;
  let crashed = false;
  if(trackLocal > edge){
    ship.lateralOffset = edge;
    ship.velX *= -0.3;
    if(trackLocal > edge + 1.6) crashed = true;
    else{
      // graze right wall
      if(lastGrazeFlash<=0){
        multiplier = Math.min(3.0, multiplier + 0.25);
        multiplierTimer = 2.2;
        showPopup('GRAZE ×'+multiplier.toFixed(2), '#ff2d8c');
        lastGrazeFlash = 0.4;
        flashWarn();
      }
    }
  } else if(trackLocal < -edge){
    ship.lateralOffset = -edge;
    ship.velX *= -0.3;
    if(trackLocal < -edge - 1.6) crashed = true;
    else{
      if(lastGrazeFlash<=0){
        multiplier = Math.min(3.0, multiplier + 0.25);
        multiplierTimer = 2.2;
        showPopup('GRAZE ×'+multiplier.toFixed(2), '#39f2e8');
        lastGrazeFlash = 0.4;
        flashWarn();
      }
    }
  }
  if(lastGrazeFlash>0) lastGrazeFlash -= dt;

  // ground collision (too low relative to floor undulation → crash), ceiling handled implicitly
  if(ship.height < 1.7 && ship.vertVel < -3) {
    // soft bounce instead of crash for minor dips
    ship.vertVel *= -0.4;
  }

  if(crashed){
    triggerCrash();
    return;
  }

  // multiplier decay
  if(multiplierTimer>0){
    multiplierTimer -= dt;
    if(multiplierTimer<=0){ multiplier = Math.max(1.0, multiplier-0.5); if(multiplier>1) multiplierTimer=1.4; }
  }
  topMultiplier = Math.max(topMultiplier, multiplier);

  // score accrual
  score += ship.forwardSpeed*dt*0.6*multiplier;

  // gates
  const shipIdxF = (-ship.pos.z)/SEG_LEN;
  gateManager.update(shipIdxF);
  for(const g of gateManager.active){
    if(!g.passed && g.z > ship.pos.z - 1.5 && g.z < ship.pos.z + 1.5){
      const dx = g.x - ship.pos.x;
      const dy = g.y - ship.pos.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(dist < 3.0){
        g.passed = true;
        gateStreak++;
        multiplier = Math.min(3.0, multiplier + 0.25);
        multiplierTimer = 2.6;
        score += 150*multiplier;
        showPopup(gateStreak>1 ? 'CHAIN ×'+gateStreak : 'GATE', currentPlanet.accentCss);
        lightDiamonds(Math.min(3, gateStreak%3===0?3:gateStreak%3));
        camShakeT = Math.max(camShakeT, 0.12);
      } else if(g.z > ship.pos.z + 0.5){
        // missed
        g.passed = true;
        gateStreak = 0;
        lightDiamonds(0);
      }
    }
  }

  // obstacles — ground hazards to dodge laterally or climb over
  obstacleManager.update(shipIdxF, distProgress);
  for(const o of obstacleManager.active){
    if(o.hit) continue;
    if(o.z > ship.pos.z - 2.2 && o.z < ship.pos.z + 2.2){
      const dx = Math.abs(o.x - ship.pos.x);
      const dy = Math.abs(o.y - ship.pos.y);
      const dz = Math.abs(o.z - ship.pos.z);
      // forgiving half-extents vs the visual box (2.0 x 3.2 x 1.7) so grazes at
      // high speed don't feel like unfair reads
      if(dx < 1.15 && dy < 1.55 && dz < 1.15){
        o.hit = true;
        triggerCrash();
        return;
      }
    }
  }

  // rift catch-up speed scales with difficulty & is dodgeable via speed/boost
  const riftSpeed = ship.forwardSpeed*0.86 - 2.0 + Math.min(10, distProgress*0.6);
  rift.update(dt, riftSpeed);
  if(rift.distanceBehind <= 7.2){
    triggerCrash();
    return;
  }

  // level completion check
  if(!isEndless && distanceM >= currentPlanet.lengthKm*1000){
    completeLevel();
    return;
  }

  updateMultBar(multiplier);
  document.getElementById('multText').textContent = '×'+multiplier.toFixed(2);
  document.getElementById('scoreNum').textContent = Math.floor(score).toLocaleString();
  document.getElementById('distLabel').textContent = (distanceM/1000).toFixed(2)+' KM';
  if(!isEndless){
    const pct = Math.min(100,(distanceM/(currentPlanet.lengthKm*1000))*100);
    document.getElementById('planetFill').style.width = pct+'%';
  } else {
    document.getElementById('planetFill').style.width = '100%';
  }

  // terrain + fx
  terrain.update(ship.pos.z);
  const speedFactor = ship.forwardSpeed / (ship.maxSpeed*currentPlanet.speedMul);
  speedLines.update(dt, speedFactor);
  if(camShakeT>0) camShakeT -= dt;
  boltTimer -= dt;
  if(boltTimer<=0){
    boltTimer = 2+Math.random()*3;
    boltMesh.material.opacity = 0.9;
  } else {
    boltMesh.material.opacity *= 0.9;
  }

  updateShipVisual(dt, steer, speedFactor);
  updateCamera(dt, speedFactor);
  drawSpeedFx(speedFactor);
}

function flashWarn(){
  const el = document.getElementById('warnFlash');
  el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'), 130);
}

function triggerCrash(){
  running = false;
  ship.alive = false;
  camShakeT = 0.9;
  flashWarn();
  showPopup('CRASH', '#ff2d2d');
  setTimeout(()=> endRun(), 250);
}

function updateShipVisual(dt, steer, speedFactor){
  ship.mesh.position.copy(ship.pos);
  ship.mesh.rotation.z = -ship.roll*0.9;
  ship.mesh.rotation.x = THREE.MathUtils.clamp(ship.vertVel*-0.02, -0.4, 0.4);
  ship.mesh.rotation.y = -steer*0.18;
  ship.parts.ringL.scale.setScalar(1+speedFactor*0.6+Math.sin(performance.now()*0.02)*0.05);
  ship.parts.ringR.scale.setScalar(1+speedFactor*0.6+Math.cos(performance.now()*0.02)*0.05);
  shipLight.position.copy(ship.pos);
  shipLight.position.y += 0.5;

  wallLightL.position.set(ship.pos.x-8, ship.pos.y+2, ship.pos.z-14);
  wallLightR.position.set(ship.pos.x+8, ship.pos.y+2, ship.pos.z-14);

  sunMesh.position.set(ship.pos.x*0.15, 18, ship.pos.z-420);
  sunGlow.position.copy(sunMesh.position);
  stars.position.set(ship.pos.x*0.3, 0, ship.pos.z);
  boltMesh.position.z = ship.pos.z - 380 + Math.sin(ship.pos.z*0.01)*20;
}

const camOffset = new THREE.Vector3(0, 3.1, 9.2);
function updateCamera(dt, speedFactor){
  const targetFov = CAM_BASE_FOV + speedFactor*22 + (boostFx>0?10:0);
  camera.fov += (targetFov-camera.fov)*Math.min(1,dt*4);
  camera.updateProjectionMatrix();

  let shakeX=0, shakeY=0;
  const shakeAmt = (SAVE.settings.shake||100)/100;
  if(camShakeT>0){
    const s = camShakeT*10*shakeAmt;
    shakeX = (Math.random()-0.5)*s;
    shakeY = (Math.random()-0.5)*s;
  }
  const wobble = Math.sin(performance.now()*0.006)*0.05*speedFactor*shakeAmt;

  const desired = ship.pos.clone().add(camOffset.clone().applyAxisAngle(new THREE.Vector3(0,1,0), ship.roll*0.15));
  desired.y += wobble*0.4;
  camera.position.lerp(desired, Math.min(1, dt*7));
  camera.position.x += shakeX*0.05;
  camera.position.y += shakeY*0.05;

  const lookTarget = ship.pos.clone();
  lookTarget.z -= 14;
  lookTarget.y += 1.2;
  camera.lookAt(lookTarget);
  camera.rotation.z = -ship.roll*0.12;
}

/* ---------------------------------------------------------------------
   13. RENDER LOOP
--------------------------------------------------------------------- */
let lastT = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now-lastT)/1000;
  lastT = now;
  update(dt);
  if(composer) composer.render();
  else renderer.render(scene, camera);
}

/* ---------------------------------------------------------------------
   14. UI WIRING
--------------------------------------------------------------------- */
const screens = ['mainMenu','levelSelect','settingsScreen','pauseScreen','gameOverScreen','levelCompleteScreen'];
function showScreen(id){
  screens.forEach(s=>{
    const el = document.getElementById(s);
    if(s===id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });
}

function buildLevelGrid(){
  const grid = document.getElementById('levelGrid');
  grid.innerHTML='';
  PLANETS.forEach((p,i)=>{
    const unlocked = i < SAVE.unlocked;
    const card = document.createElement('div');
    card.className = 'level-card'+(unlocked?'':' locked');
    card.style.setProperty('--accent', '#'+p.accent.toString(16).padStart(6,'0'));
    const bestKm = SAVE.bestsKm[i]||0;
    const pct = Math.min(100, Math.round((bestKm/p.lengthKm)*100));
    card.innerHTML = `
      <div class="pnum">PLANET ${i+1}</div>
      <div class="pname">${p.name}</div>
      <div class="pdesc">${p.sub}</div>
      <div class="pbest">${p.lengthKm.toFixed(1)} KM · BEST ${pct}%</div>
      ${unlocked? '' : '<div class="lock-icon">🔒</div>'}
    `;
    if(unlocked){
      tappable(card, ()=>{ startRun(p, false); });
    }
    grid.appendChild(card);
  });
  const endlessCard = document.createElement('div');
  endlessCard.className='level-card endless';
  const bestKm = SAVE.bestsKm[8]||0;
  endlessCard.innerHTML = `<div><div class="pnum">∞ ENDLESS</div><div class="pname">ENDLESS RIFT</div></div><div class="pbest">BEST ${bestKm.toFixed(2)} KM</div>`;
  tappable(endlessCard, ()=>{ startRun(ENDLESS, true); });
  grid.appendChild(endlessCard);
}

document.getElementById('btnPlay').addEventListener('click', ()=>{ buildLevelGrid(); showScreen('levelSelect'); requestFullscreenAndLock(); });
document.getElementById('btnEndless').addEventListener('click', ()=>{ requestFullscreenAndLock(); startRun(ENDLESS, true); });
document.getElementById('btnBackFromLevels').addEventListener('click', ()=> showScreen('mainMenu'));
document.getElementById('btnSettings').addEventListener('click', ()=> showScreen('settingsScreen'));
document.getElementById('btnBackFromSettings').addEventListener('click', ()=> showScreen('mainMenu'));
document.getElementById('btnResetProgress').addEventListener('click', ()=>{
  if(confirm('Reset all progress and settings?')){
    SAVE = { unlocked:1, bests:new Array(9).fill(0), bestsKm:new Array(9).fill(0), settings:{sens:100, shake:100, invert:0} };
    saveSave();
    sensSlider.value=100; shakeSlider.value=100; invertSlider.value=0;
    sensVal.textContent='100%'; shakeVal.textContent='100%'; invertVal.textContent='OFF';
  }
});

document.getElementById('btnRetry').addEventListener('click', ()=> startRun(currentPlanet, isEndless));
document.getElementById('btnGoMenu').addEventListener('click', ()=>{ showScreen('mainMenu'); document.getElementById('hud').style.display='none'; });
document.getElementById('btnNextLevel').addEventListener('click', ()=>{
  const nextIdx = currentPlanet.id+1;
  if(nextIdx < PLANETS.length) startRun(PLANETS[nextIdx], false);
  else { showScreen('mainMenu'); document.getElementById('hud').style.display='none'; }
});
document.getElementById('btnLcMenu').addEventListener('click', ()=>{ showScreen('mainMenu'); document.getElementById('hud').style.display='none'; });

document.getElementById('btnResume').addEventListener('click', ()=> setPaused(false));
document.getElementById('btnRestartPause').addEventListener('click', ()=> startRun(currentPlanet, isEndless));
document.getElementById('btnQuitPause').addEventListener('click', ()=>{
  running=false; showScreen('mainMenu'); document.getElementById('hud').style.display='none';
  document.getElementById('touchControls').classList.remove('active'); boostBtn.style.display='none'; document.getElementById('climbHint').style.display='none';
});

function tappable(el, fn){
  let fired = false;
  el.addEventListener('touchend', e=>{ fired = true; e.preventDefault(); fn(e); setTimeout(()=>fired=false, 400); }, {passive:false});
  el.addEventListener('click', e=>{ if(fired) return; fn(e); });
}

function togglePause(){ setPaused(!paused); }
function setPaused(p, showUI=true){
  if(!running && !p) return;
  paused = p;
  if(p){ if(showUI!==false) showScreen('pauseScreen'); }
  else { showScreen(null); }
}
// Tap canvas with two fingers or Escape to pause (also expose a pause tap zone top-center)
window.addEventListener('keydown', e=>{ if(e.code==='KeyP') togglePause(); });

// settings sliders
const sensSlider = document.getElementById('sensSlider');
const shakeSlider = document.getElementById('shakeSlider');
const invertSlider = document.getElementById('invertSlider');
const sensVal = document.getElementById('sensVal');
const shakeVal = document.getElementById('shakeVal');
const invertVal = document.getElementById('invertVal');
sensSlider.value = SAVE.settings.sens; shakeSlider.value = SAVE.settings.shake; invertSlider.value = SAVE.settings.invert;
sensVal.textContent = SAVE.settings.sens+'%'; shakeVal.textContent = SAVE.settings.shake+'%'; invertVal.textContent = SAVE.settings.invert? 'ON':'OFF';
sensSlider.addEventListener('input', ()=>{ SAVE.settings.sens = +sensSlider.value; sensVal.textContent = SAVE.settings.sens+'%'; saveSave(); });
shakeSlider.addEventListener('input', ()=>{ SAVE.settings.shake = +shakeSlider.value; shakeVal.textContent = SAVE.settings.shake+'%'; saveSave(); });
invertSlider.addEventListener('input', ()=>{ SAVE.settings.invert = +invertSlider.value; invertVal.textContent = SAVE.settings.invert? 'ON':'OFF'; saveSave(); });

function requestFullscreenAndLock(){
  const el = document.documentElement;
  const req = el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(req && isTouchDevice()){
    try{ req.call(el).then(()=>tryLockLandscape()).catch(()=>{}); }catch(e){}
  }
  // iOS 13+ requires an explicit user-gesture permission prompt for motion/orientation events
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().catch(()=>{});
  }
}

// Pause via tap on HUD top area (mobile-friendly) — double area near score doesn't pause;
// add a small dedicated pause tap target
const pauseTapZone = document.createElement('div');
pauseTapZone.style.cssText = 'position:fixed; top:0; right:0; width:52px; height:52px; z-index:60;';
tappable(pauseTapZone, ()=>{ if(running) togglePause(); });
document.body.appendChild(pauseTapZone);

/* ---------------------------------------------------------------------
   15. BOOT
--------------------------------------------------------------------- */
function applyAmbiencePalette(p){
  // Subset of setPlanetPalette() that doesn't touch `terrain` — safe to call
  // before any run has started (terrain is only constructed in startRun()).
  scene.fog.color.setHex(p.fog);
  sunMesh.material.color.setHex(p.sun);
  sunGlow.material.color.setHex(p.sun);
  wallLightL.color.setHex(p.wallLight);
  wallLightR.color.setHex(p.wallLight);
  hemi.color.setHex(p.wallLight);
  boltGroup.remove(boltMesh);
  boltMesh = makeBoltMesh(p.boltColor);
  boltMesh.position.set((Math.random()-0.5)*30, 0, -370-Math.random()*40);
  boltGroup.add(boltMesh);
}

function boot(){
  onResize();
  checkOrientation();
  applyAmbiencePalette(PLANETS[0]);
  document.getElementById('loadingScreen').style.display='none';
  showScreen('mainMenu');
  animate();
  // Bloom/RGB-shift load in the background; game is already playable without them.
  setupPostProcessingAsync();
}
boot();

}
